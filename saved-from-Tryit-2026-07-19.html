<!DOCTYPE html>
<html>
<body>



<h1 id="h1">Літо</h1>

<p id="season">Літо — це найтепліша пора року між весною та осінню з найвищими температурами та найдовшими світловими днями. Для Північної півкулі календарний сезон триває з 1 червня до 31 серпня. Це період відпусток, канікул, зеленої природи, пляжного відпочинку та активного проведення часу просто неба.</p>

<button onclick="winter()">Зима</button>

<button onclick="summer()">Літо</button>
<button onclick="autumn()">Осінь</button>

let heading1 = document.getElementById("h1")
let season = document.getElementById("season")

 season.style.color = "white";

}

 heading1.style.color = "hotpink";
 season.style.color = "hotpink";

}

 heading1.style.color = "indianred";
 season.style.color = "indianred";
